[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apk-lens"
version = "0.1.0"
description = "Educational static-analysis toolkit for Android apps: point it at an APK and read what it is built to collect."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jackson Mafra" }]
keywords = ["android", "apk", "static-analysis", "privacy", "reverse-engineering", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jacksonmafra-umain/apk-lens"
Issues = "https://github.com/jacksonmafra-umain/apk-lens/issues"

[project.scripts]
apk-lens = "apk_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apk_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
