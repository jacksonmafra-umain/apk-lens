# Host attribution.
#
# A list of 400 domains means nothing on its own. Naming the operator turns it
# into something a reader can reason about: "the app talks to its own servers,
# four analytics vendors, two ad exchanges and one CDN" is an answer.
#
# `match` entries are matched against the registrable domain and against the
# full hostname, case-insensitively, as a substring.
#
# purpose values:
#   api            first-party or vendor API traffic
#   cdn            static content delivery
#   analytics      product and behavioural measurement
#   attribution    linking an install or a click to a campaign
#   ads            advertising supply, demand or measurement
#   crash          crash and performance reporting
#   push           push notifications and in-app messaging
#   auth           sign-in and identity
#   payments       payment processing
#   antifraud      bot, fraud and device-integrity checks
#   config         remote configuration and A/B testing
#   support        customer support and feedback
#   infrastructure cloud hosting, DNS, certificates
#   specification  namespace and documentation URLs that are not network traffic
version: 1

# These are compiled into almost every Android app and are never contacted.
# Counting them as "servers the app talks to" is the most common way a host
# census overstates its findings, so they get their own bucket.
specification_markers:
  - schemas.android.com
  - www.w3.org
  - www.apache.org
  - xmlpull.org
  - java.sun.com
  - javax.xml
  - purl.org
  - relaxng.org
  - jcp.org
  - json-schema.org
  - openjdk.org
  - kotlinlang.org
  - github.com
  - stackoverflow.com
  - developer.android.com
  - source.android.com
  - developers.google.com
  - opensource.org
  - creativecommons.org
  - gnu.org

operators:
  - operator: Google
    match: [google.com, googleapis.com, gstatic.com, googleusercontent.com, google-analytics.com,
            googletagmanager.com, gvt1.com, gvt2.com, withgoogle.com, goo.gl, android.com]
    category: platform
    purpose: api
    collects: Play services identity, app configuration, analytics events.
  - operator: Google Firebase
    match: [firebaseio.com, firebaseapp.com, firebase.google.com, firebaseinstallations.googleapis.com,
            firebaseremoteconfig.googleapis.com, firebasedynamiclinks.googleapis.com]
    category: backend
    purpose: config
    collects: Installation identifier, remote config, event analytics.
  - operator: Google Crashlytics
    match: [crashlytics.com, firebasecrashlytics.googleapis.com]
    category: crash reporting
    purpose: crash
    collects: Stack traces, device model, OS version, breadcrumb logs.
  - operator: Google Ad Services
    match: [doubleclick.net, googlesyndication.com, googleadservices.com, admob.com, adservice.google.com]
    category: advertising
    purpose: ads
    collects: Advertising identifier, ad interactions, coarse location.
  - operator: Meta
    match: [facebook.com, facebook.net, fbcdn.net, fb.com, graph.facebook.com, instagram.com,
            whatsapp.com, meta.com]
    category: advertising and social
    purpose: attribution
    collects: Advertising identifier, app events, install attribution.
  - operator: Amazon Web Services
    match: [amazonaws.com, awsstatic.com, cloudfront.net, amazon.com]
    category: cloud hosting
    purpose: infrastructure
    collects: Whatever the app's own backend sends; AWS is the host, not the party.
  - operator: Microsoft Azure
    match: [azure.com, azureedge.net, azurewebsites.net, windows.net, microsoft.com, msedge.net]
    category: cloud hosting
    purpose: infrastructure
    collects: Whatever the app's own backend sends.
  - operator: Cloudflare
    match: [cloudflare.com, cloudflare.net, cdnjs.cloudflare.com, workers.dev, pages.dev]
    category: cdn
    purpose: cdn
    collects: Request metadata in transit.
  - operator: Fastly
    match: [fastly.net, fastlylb.net, fastly.com]
    category: cdn
    purpose: cdn
  - operator: Akamai
    match: [akamai.net, akamaized.net, akamaihd.net, edgekey.net, edgesuite.net, akamaitechnologies.com]
    category: cdn
    purpose: cdn
  - operator: Apple
    match: [apple.com, icloud.com, mzstatic.com, itunes.apple.com]
    category: platform
    purpose: api
  - operator: Adjust
    match: [adjust.com, adjust.io, adjust.net.in, adjust.world]
    category: attribution
    purpose: attribution
    collects: Advertising identifier, install and click attribution, session events.
  - operator: AppsFlyer
    match: [appsflyer.com, appsflyersdk.com, af-webhook.com]
    category: attribution
    purpose: attribution
    collects: Advertising identifier, referrer, install and in-app events.
  - operator: Branch
    match: [branch.io, bnc.lt, app.link]
    category: attribution
    purpose: attribution
    collects: Device fingerprint for deferred deep linking, click attribution.
  - operator: Kochava
    match: [kochava.com, kochava.net]
    category: attribution
    purpose: attribution
  - operator: Singular
    match: [singular.net, sng.link]
    category: attribution
    purpose: attribution
  - operator: Amplitude
    match: [amplitude.com, api.amplitude.com]
    category: product analytics
    purpose: analytics
    collects: Event stream keyed to a user or device identifier.
  - operator: Mixpanel
    match: [mixpanel.com]
    category: product analytics
    purpose: analytics
  - operator: Segment
    match: [segment.com, segment.io, segmentapis.com]
    category: analytics pipeline
    purpose: analytics
    collects: Forwards a single event stream to many other vendors.
  - operator: Firebase Analytics via Google
    match: [app-measurement.com]
    category: product analytics
    purpose: analytics
    collects: Automatic and custom app events, advertising identifier.
  - operator: Sentry
    match: [sentry.io, ingest.sentry.io]
    category: crash reporting
    purpose: crash
  - operator: Bugsnag
    match: [bugsnag.com]
    category: crash reporting
    purpose: crash
  - operator: Datadog
    match: [datadoghq.com, datadoghq.eu, ddog-gov.com]
    category: observability
    purpose: crash
  - operator: New Relic
    match: [newrelic.com, nr-data.net]
    category: observability
    purpose: crash
  - operator: Unity
    match: [unity3d.com, unityads.unity3d.com, unity.com]
    category: game platform and ads
    purpose: ads
  - operator: AppLovin
    match: [applovin.com, applvn.com, applovin-a.akamaihd.net]
